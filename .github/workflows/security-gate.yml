name: Security gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify sanitized application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # releases/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # releases/v4
        with:
          node-version: 22
          cache: npm
      - name: Ensure release process inspection is available
        run: |
          if ! command -v lsof >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends lsof
          fi
          command -v lsof >/dev/null 2>&1
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run the complete security gate
        run: npm run verify:ci
